name: Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test parsing, proxy isolation and install lifecycle
        shell: powershell
        run: ./tests/Run-Tests.ps1
  powershell-7:
    name: PowerShell 7
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test parsing, proxy isolation and install lifecycle
        shell: pwsh
        run: ./tests/Run-Tests.ps1
